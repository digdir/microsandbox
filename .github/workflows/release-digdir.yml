name: Release Digdir Rust SDK runtime

# Downstream copy of the upstream release lanes that publishes only the host
# runtime artifacts consumed by the Rust SDK: the `msb` bundle, the standalone
# libkrunfw library and the guest agent. It inherits none of upstream's later
# workflow fixes automatically; compare it against `release.yml`,
# `release-linux.yml`, `release-macos.yml` and `release-windows.yml` on every
# upstream synchronization (see MAINTAINING-digdir.md).

on:
  push:
    # Source-only tags (v<runtime-version>-source.<n>) reuse an already published
    # runtime and must not start a release.
    tags: ["v*-digdir.*", "!v*-digdir.*-source.*"]
  # A manual run builds and validates every release artifact without
  # publishing, so that a failing release is caught before a tag is spent.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_INCREMENTAL: "0"
  LIBKRUNFW_VERSION: "5.6.1"
  LIBKRUNFW_ABI: "5"
  # Every shipped Linux ELF is compiled or linked inside the architecture-native
  # manylinux 2.28 container, so the published runtime does not import glibc
  # symbols newer than the hosts it is installed on. Validated below.
  LINUX_GLIBC_BASELINE: "2.28"

permissions:
  contents: read

jobs:
  validate:
    name: Validate downstream release
    if: github.repository == 'digdir/microsandbox'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout libkrunfw sources
        run: git submodule update --init --depth 1 vendor/libkrunfw

      - name: Validate version and firmware source
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          expected_tag="v${version}"
          if [ "${GITHUB_EVENT_NAME}" = push ] && [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match workspace version ${version}"
            exit 1
          fi
          case "${version}" in
            *-digdir.*) ;;
            *)
              echo "::error::workspace version must contain the -digdir.N prerelease suffix"
              exit 1
              ;;
          esac
          expected_remote=https://github.com/digdir/libkrunfw.git
          actual_remote=$(git config --file .gitmodules --get submodule.vendor/libkrunfw.url)
          if [ "${actual_remote}" != "${expected_remote}" ]; then
            echo "::error::libkrunfw submodule uses ${actual_remote}, expected ${expected_remote}"
            exit 1
          fi
          status=$(git submodule status vendor/libkrunfw)
          case "${status}" in
            [-+]*)
              echo "::error::libkrunfw submodule is not at its committed revision: ${status}"
              exit 1
              ;;
          esac

      - name: Validate the release validators
        run: python3 -m unittest scripts.ci.test_validate_linux_glibc scripts.ci.test_validate_release_artifacts

  build-kernel:
    name: Build guest kernel (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout libkrunfw sources
        run: git submodule update --init --depth 1 vendor/libkrunfw

      - name: Install kernel build dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison flex gcc libelf-dev make python3-pyelftools

      - name: Prepare kernel source
        uses: ./.github/actions/cache-libkrunfw-kernel

      # Only the generated kernel.c bundle leaves this job. Every host lane
      # links its own libkrunfw from it so the library shares that platform's
      # toolchain baseline.
      - name: Build kernel firmware bundle
        working-directory: vendor/libkrunfw
        run: make -j$(nproc) kernel.c

      - name: Upload kernel firmware bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-kernel-${{ matrix.arch }}
          path: vendor/libkrunfw/kernel.c
          compression-level: 0

  build-agentd:
    name: Build guest agent (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pinned-rust-toolchain-digdir
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          shared-key: release-agentd-${{ matrix.arch }}

      - name: Install musl build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build agentd
        run: |
          cargo build --locked --release --manifest-path crates/agentd/Cargo.toml --target ${{ matrix.target }}
          mkdir -p build
          cp target/${{ matrix.target }}/release/agentd build/agentd

      - name: Upload agentd
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-agentd-${{ matrix.arch }}
          path: build/agentd
          compression-level: 0

  build-linux:
    name: Build runtime (${{ matrix.target }})
    needs: [validate, build-kernel, build-agentd]
    runs-on: ${{ matrix.runner }}
    # Digest-pinned manylinux 2.28 images, kept identical to upstream release.yml.
    container:
      image: ${{ matrix.manylinux_image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            arch: x86_64
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b
            libkrunfw_file: libkrunfw.so.5.6.1
            libkrunfw_asset: libkrunfw-linux-x86_64.so
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:561427136aabf3787bffb294b3515748241e0962d1527ae28bea1e076bfb9d99
            libkrunfw_file: libkrunfw.so.5.6.1
            libkrunfw_asset: libkrunfw-linux-aarch64.so
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pinned-rust-toolchain-digdir

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          shared-key: release-runtime-${{ matrix.target }}

      - name: Install build dependencies
        run: dnf install -y libcap-ng-devel

      - name: Download guest agent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-agentd-${{ matrix.arch }}
          path: build/

      - name: Download kernel firmware bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-kernel-${{ matrix.arch }}
          path: firmware/

      - name: Link libkrunfw against the baseline
        run: |
          mkdir -p build
          cc -fPIC -DABI_VERSION=${{ env.LIBKRUNFW_ABI }} -shared \
            -Wl,-soname,libkrunfw.so.${{ env.LIBKRUNFW_ABI }} \
            -o build/${{ matrix.libkrunfw_file }} firmware/kernel.c
          strip build/${{ matrix.libkrunfw_file }}

      - name: Build msb
        run: |
          cargo build --locked --release --no-default-features --features embed-binaries,net,ssh -p microsandbox-cli
          cp target/release/msb build/msb

      - name: Verify runtime and glibc baseline
        run: |
          build/msb --version
          python3 scripts/ci/validate_linux_glibc.py \
            --max-version ${{ env.LINUX_GLIBC_BASELINE }} \
            build/agentd build/msb build/${{ matrix.libkrunfw_file }}

      - name: Smoke test installed runtime discovery
        run: |
          python3 scripts/smoke/cli/runtime-discovery.py \
            --msb build/msb --libkrunfw build/${{ matrix.libkrunfw_file }}

      - name: Stage runtime artifacts
        run: |
          set -euo pipefail
          mkdir -p artifacts
          # The bundle is created in the build job, before any artifact round
          # trip can normalize modes; assert the executable bit anyway.
          chmod 755 build/msb
          cp build/${{ matrix.libkrunfw_file }} artifacts/${{ matrix.libkrunfw_asset }}
          tar -czf artifacts/microsandbox-${{ matrix.target }}.tar.gz \
            -C build msb ${{ matrix.libkrunfw_file }}

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-runtime-${{ matrix.target }}
          path: artifacts/
          compression-level: 0

  build-macos:
    name: Build runtime (${{ matrix.target }})
    needs: [validate, build-kernel, build-agentd]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-aarch64
            runner: macos-14
            arch: aarch64
            libkrunfw_file: libkrunfw.5.dylib
            libkrunfw_asset: libkrunfw-darwin-aarch64.dylib
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pinned-rust-toolchain-digdir

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          shared-key: release-runtime-${{ matrix.target }}

      - name: Download guest agent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-agentd-${{ matrix.arch }}
          path: build/

      - name: Download kernel firmware bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-kernel-${{ matrix.arch }}
          path: firmware/

      - name: Build libkrunfw
        run: |
          mkdir -p build
          cc -fPIC -DABI_VERSION=${{ env.LIBKRUNFW_ABI }} -shared \
            -o build/${{ matrix.libkrunfw_file }} firmware/kernel.c

      - name: Build msb
        run: |
          cargo build --locked --release --no-default-features --features embed-binaries,net,ssh -p microsandbox-cli
          cp target/release/msb build/msb

      - name: Codesign msb
        run: codesign --entitlements msb-entitlements.plist --force -s - build/msb

      - name: Verify runtime binary
        run: build/msb --version

      - name: Smoke test installed runtime discovery
        run: |
          python3 scripts/smoke/cli/runtime-discovery.py \
            --msb build/msb --libkrunfw build/${{ matrix.libkrunfw_file }}

      - name: Stage runtime artifacts
        # bsdtar would otherwise add AppleDouble entries for extended attributes,
        # which the runtime installer rejects.
        env:
          COPYFILE_DISABLE: "1"
        run: |
          set -euo pipefail
          mkdir -p artifacts
          chmod 755 build/msb
          cp build/${{ matrix.libkrunfw_file }} artifacts/${{ matrix.libkrunfw_asset }}
          tar -czf artifacts/microsandbox-${{ matrix.target }}.tar.gz \
            -C build msb ${{ matrix.libkrunfw_file }}

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-runtime-${{ matrix.target }}
          path: artifacts/
          compression-level: 0

  build-windows:
    name: Build runtime (${{ matrix.target }})
    needs: [validate, build-kernel, build-agentd]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-latest
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            vs_arch: amd64
            vs_host_arch: amd64
            libkrunfw_asset: libkrunfw-windows-x86_64.dll
          - target: windows-aarch64
            runner: windows-11-arm
            arch: aarch64
            rust_target: aarch64-pc-windows-msvc
            vs_arch: arm64
            vs_host_arch: arm64
            libkrunfw_asset: libkrunfw-windows-aarch64.dll
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only Windows needs libkrunfw's MSVC helper scripts.
      - name: Checkout libkrunfw sources
        shell: pwsh
        run: git submodule update --init --depth 1 vendor/libkrunfw

      - uses: ./.github/actions/pinned-rust-toolchain-digdir
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          shared-key: release-runtime-${{ matrix.target }}

      - name: Download kernel firmware bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-kernel-${{ matrix.arch }}
          path: vendor/libkrunfw/

      - name: Download guest agent
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: runtime-agentd-${{ matrix.arch }}
          path: build/

      - name: Build libkrunfw
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\vendor\libkrunfw\scripts\build-windows.ps1 `
            -SkipKernelBundle `
            -AbiVersion ${{ env.LIBKRUNFW_ABI }} `
            -Architecture ${{ matrix.vs_arch }} `
            -HostArchitecture ${{ matrix.vs_host_arch }} `
            -Output libkrunfw.dll `
            -ImportLibrary libkrunfw.lib
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Copy-Item vendor\libkrunfw\libkrunfw.dll build\libkrunfw.dll -Force

      - name: Build msb
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ matrix.vs_arch }} -HostArchitecture ${{ matrix.vs_host_arch }}
          cargo build --locked --release --no-default-features --features embed-binaries,net,ssh -p microsandbox-cli --target ${{ matrix.rust_target }}
          Copy-Item target\${{ matrix.rust_target }}\release\msb.exe build\msb.exe -Force
          & build\msb.exe --version

      - name: Smoke test installed runtime discovery
        shell: pwsh
        run: python scripts/smoke/cli/runtime-discovery.py --msb build/msb.exe --libkrunfw build/libkrunfw.dll

      - name: Stage runtime artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Copy-Item build\libkrunfw.dll artifacts\${{ matrix.libkrunfw_asset }} -Force
          tar.exe -czf artifacts\microsandbox-${{ matrix.target }}.tar.gz -C build msb.exe libkrunfw.dll

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-runtime-${{ matrix.target }}
          path: artifacts/
          compression-level: 0

  assemble:
    name: Assemble downstream runtime release
    needs: [validate, build-agentd, build-linux, build-macos, build-windows]
    runs-on: ubuntu-latest
    # Only this job publishes the release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout libkrunfw sources
        run: git submodule update --init --depth 1 vendor/libkrunfw

      - name: Download runtime artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
          pattern: release-runtime-*
          merge-multiple: true

      - name: Download guest agents
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: guest-agents
          pattern: runtime-agentd-*

      - name: Validate artifact set
        shell: bash
        run: |
          set -euo pipefail
          cp guest-agents/runtime-agentd-x86_64/agentd release-artifacts/agentd-x86_64
          cp guest-agents/runtime-agentd-aarch64/agentd release-artifacts/agentd-aarch64
          expected=(
            agentd-aarch64
            agentd-x86_64
            libkrunfw-darwin-aarch64.dylib
            libkrunfw-linux-aarch64.so
            libkrunfw-linux-x86_64.so
            libkrunfw-windows-aarch64.dll
            libkrunfw-windows-x86_64.dll
            microsandbox-darwin-aarch64.tar.gz
            microsandbox-linux-aarch64.tar.gz
            microsandbox-linux-x86_64.tar.gz
            microsandbox-windows-aarch64.tar.gz
            microsandbox-windows-x86_64.tar.gz
          )
          for artifact in "${expected[@]}"; do
            if [ ! -s "release-artifacts/${artifact}" ]; then
              echo "::error::missing or empty release artifact: ${artifact}"
              exit 1
            fi
          done
          actual_count=$(find release-artifacts -maxdepth 1 -type f | wc -l)
          if [ "${actual_count}" -ne "${#expected[@]}" ]; then
            echo "::error::expected ${#expected[@]} artifacts, found ${actual_count}"
            find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort
            exit 1
          fi

      # The runtime installer accepts exactly the two regular files of a bundle.
      - name: Validate bundle entries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          import tarfile
          from pathlib import Path

          expected = {
              "microsandbox-linux-x86_64.tar.gz": {"msb", "libkrunfw.so.5.6.1"},
              "microsandbox-linux-aarch64.tar.gz": {"msb", "libkrunfw.so.5.6.1"},
              "microsandbox-darwin-aarch64.tar.gz": {"msb", "libkrunfw.5.dylib"},
              "microsandbox-windows-x86_64.tar.gz": {"msb.exe", "libkrunfw.dll"},
              "microsandbox-windows-aarch64.tar.gz": {"msb.exe", "libkrunfw.dll"},
          }
          failed = False
          for bundle, names in expected.items():
              with tarfile.open(Path("release-artifacts") / bundle) as archive:
                  members = archive.getmembers()
              actual = {member.name for member in members}
              irregular = [member.name for member in members if not member.isreg()]
              if actual != names or len(members) != len(names) or irregular:
                  print(f"::error::{bundle} has entries {sorted(actual)}; expected {sorted(names)}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      # Unix bundles must extract an executable msb; artifact round trips normalize modes.
      - name: Validate bundled msb executable mode
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, "scripts/ci")
          import importlib.util
          spec = importlib.util.spec_from_file_location(
              "validate_release_artifacts", "scripts/ci/validate-release-artifacts.py"
          )
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          errors: list[str] = []
          for bundle in (
              "microsandbox-linux-x86_64.tar.gz",
              "microsandbox-linux-aarch64.tar.gz",
              "microsandbox-darwin-aarch64.tar.gz",
          ):
              module.validate_bundle_executable(Path("release-artifacts") / bundle, errors)
          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)
          print("bundled msb is executable in every Unix bundle")
          PY

      # Gate over the published files, not only the build-job outputs: the
      # earlier check protects the build, this one protects the release.
      - name: Validate Linux glibc baseline
        run: |
          python3 -m unittest scripts.ci.test_validate_linux_glibc
          python3 scripts/ci/validate_linux_glibc.py \
            --max-version ${{ env.LINUX_GLIBC_BASELINE }} \
            release-artifacts

      # The firmware is GPL-2.0 software, so its corresponding source is
      # published with it, named by an immutable libkrunfw tag (see MAINTAINING-digdir.md).
      - name: Resolve firmware source
        id: firmware
        shell: bash
        run: |
          set -euo pipefail
          commit=$(git -C vendor/libkrunfw rev-parse HEAD)
          tag=$(git ls-remote --tags https://github.com/digdir/libkrunfw.git 'refs/tags/v*-digdir.*' \
            | awk -v commit="${commit}" '$1 == commit { sub("refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2; exit }')
          if [ -z "${tag}" ]; then
            if [ "${GITHUB_EVENT_NAME}" = push ]; then
              echo "::error::libkrunfw commit ${commit} has no v*-digdir.* tag in digdir/libkrunfw; tag it before releasing"
              exit 1
            fi
            echo "::warning::libkrunfw commit ${commit} has no v*-digdir.* tag yet; tag it before the release"
            tag=${commit:0:12}
          fi
          kernel_version=$(awk '$1 == "KERNEL_VERSION" { print $3; exit }' vendor/libkrunfw/Makefile)
          if [ -z "${kernel_version}" ]; then
            echo "::error::vendor/libkrunfw/Makefile must define KERNEL_VERSION"
            exit 1
          fi
          {
            echo "commit=${commit}"
            echo "tag=${tag}"
            echo "kernel-version=${kernel_version}"
          } >> "${GITHUB_OUTPUT}"

      # Downloads the kernel tarball and verifies it against upstream's pinned
      # checksum, as the kernel build jobs do.
      - name: Fetch kernel source
        uses: ./.github/actions/cache-libkrunfw-kernel

      - name: Add firmware source
        id: firmware-source
        shell: bash
        env:
          FIRMWARE_TAG: ${{ steps.firmware.outputs.tag }}
          KERNEL_VERSION: ${{ steps.firmware.outputs.kernel-version }}
        run: |
          set -euo pipefail
          git -C vendor/libkrunfw archive --format=tar.gz --prefix="libkrunfw-${FIRMWARE_TAG}/" \
            -o "${GITHUB_WORKSPACE}/release-artifacts/libkrunfw-source.tar.gz" HEAD
          cp "vendor/libkrunfw/tarballs/${KERNEL_VERSION}.tar.gz" "release-artifacts/${KERNEL_VERSION}.tar.gz"
          kernel_sha256=$(sha256sum "release-artifacts/${KERNEL_VERSION}.tar.gz" | cut -d ' ' -f 1)
          echo "kernel-sha256=${kernel_sha256}" >> "${GITHUB_OUTPUT}"

      - uses: ./.github/actions/pinned-rust-toolchain-digdir

      - name: Install cargo-about
        run: cargo install cargo-about --locked --features cli --version 0.9.2

      - name: Add licenses and third-party notices
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE release-artifacts/LICENSE
          cp vendor/libkrunfw/LICENSE-GPL-2.0-only release-artifacts/LICENSE-libkrunfw-GPL-2.0-only
          cp vendor/libkrunfw/LICENSE-LGPL-2.1-only release-artifacts/LICENSE-libkrunfw-LGPL-2.1-only
          scripts/digdir/third-party-notices.sh release-artifacts/THIRD_PARTY_NOTICES.md

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          (cd release-artifacts && sha256sum * > checksums.sha256)
          (cd release-artifacts && sha256sum --check --strict checksums.sha256)

      - name: Upload release assets for inspection
        if: github.event_name != 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: release-artifacts/
          compression-level: 0
          retention-days: 7

      # Manual runs write the notes too, to the job summary, so that the
      # upstream base check below runs before a tag is spent.
      - name: Write release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FIRMWARE_TAG: ${{ steps.firmware.outputs.tag }}
          KERNEL_VERSION: ${{ steps.firmware.outputs.kernel-version }}
          KERNEL_SHA256: ${{ steps.firmware-source.outputs.kernel-sha256 }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          upstream_tag="v${version%-digdir.*}"
          upstream_commit=$(git ls-remote https://github.com/superradcompany/microsandbox.git \
            "refs/tags/${upstream_tag}" "refs/tags/${upstream_tag}^{}" | awk 'END { print $1 }')
          if [ -z "${upstream_commit}" ]; then
            echo "::error::upstream release tag ${upstream_tag} not found"
            exit 1
          fi
          status=$(gh api "repos/${GITHUB_REPOSITORY}/compare/${upstream_commit}...${GITHUB_SHA}" --jq .status)
          if [ "${status}" != ahead ]; then
            echo "::error::${GITHUB_SHA} is not based on upstream ${upstream_tag} (${upstream_commit}): ${status}"
            exit 1
          fi
          cat > release-notes.md <<EOF
          Digdir build of Microsandbox ${GITHUB_REF_NAME#v}, built from ${GITHUB_SHA}.

          - Modifications: [the Digdir changes](https://github.com/${GITHUB_REPOSITORY}/compare/${upstream_commit}...${GITHUB_SHA}) on top of upstream Microsandbox [${upstream_tag}](https://github.com/superradcompany/microsandbox/releases/tag/${upstream_tag}).
          - Runtime: \`microsandbox-*.tar.gz\` host runtime bundles, libkrunfw libraries and guest agents for Linux, macOS and Windows.
          - Firmware: libkrunfw [${FIRMWARE_TAG}](https://github.com/digdir/libkrunfw/tree/${FIRMWARE_TAG}) with ${KERNEL_VERSION} (SHA-256 \`${KERNEL_SHA256}\`).
          - Licenses: Microsandbox is licensed under Apache-2.0 (\`LICENSE\`). \`THIRD_PARTY_NOTICES.md\` lists the bundled third-party components. The GPL-2.0 corresponding source of the firmware is attached as \`libkrunfw-source.tar.gz\` and \`${KERNEL_VERSION}.tar.gz\`.
          - Checksums: \`checksums.sha256\`.
          EOF
          cat release-notes.md >> "${GITHUB_STEP_SUMMARY}"

      # Immutable releases lock their assets on publication, so upload every
      # asset to a draft first and publish it last. A draft left by a failed
      # run is not immutable and is replaced. Manual runs stop before this.
      - name: Create GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft 2>/dev/null)" = true ]; then
            gh release delete "${GITHUB_REF_NAME}" --yes
          fi
          gh release create "${GITHUB_REF_NAME}" --draft --prerelease \
            --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          gh release upload "${GITHUB_REF_NAME}" release-artifacts/*
          gh release edit "${GITHUB_REF_NAME}" --draft=false
