name: Release Digdir Rust SDK runtime

# Publishes the runtime when main-digdir moves to a version that has no release yet. It builds
# nothing: it publishes the release assets that check-digdir.yml built, tested and assembled from
# exactly the tree that landed, and creates the v<version> tag on the landed commit as it
# publishes the release. Tags and published releases are immutable, so a run that fails spends no
# version. A push whose version is already released is not a release, and the run ends at once.

on:
  push:
    branches: [main-digdir]
  # Retries a release that failed, such as one that landed before libkrunfw was tagged.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publish downstream runtime release
    if: github.repository == 'digdir/microsandbox'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # To find the check-digdir.yml run of this tree and download its release assets.
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the release
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != refs/heads/main-digdir ]; then
            echo "::error::a release is published from main-digdir, not ${GITHUB_REF}"
            exit 1
          fi
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          tag="v${version}"
          status=0
          git ls-remote --exit-code origin "refs/tags/${tag}" > /dev/null || status=$?
          case "${status}" in
            0)
              echo "::notice::${tag} is already released; this push publishes nothing"
              echo "publish=false" >> "${GITHUB_OUTPUT}"
              exit 0
              ;;
            2) ;;
            *) echo "::error::could not check whether ${tag} exists"; exit 1 ;;
          esac
          {
            echo "publish=true"
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

      # The firmware is GPL-2.0 software, published with its corresponding source and named by an
      # immutable libkrunfw tag (see MAINTAINING-digdir.md).
      - name: Resolve the firmware tag
        id: firmware
        if: steps.release.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 vendor/libkrunfw
          commit=$(git -C vendor/libkrunfw rev-parse HEAD)
          tag=$(git ls-remote --tags https://github.com/digdir/libkrunfw.git 'refs/tags/v*-digdir.*' \
            | awk -v commit="${commit}" '$1 == commit { sub("refs/tags/", "", $2); sub("\\^\\{\\}$", "", $2); print $2; exit }')
          if [ -z "${tag}" ]; then
            echo "::error::libkrunfw commit ${commit} has no v*-digdir.* tag in digdir/libkrunfw; tag it, then run this workflow again"
            exit 1
          fi
          kernel_version=$(awk '$1 == "KERNEL_VERSION" { print $3; exit }' vendor/libkrunfw/Makefile)
          {
            echo "tag=${tag}"
            echo "kernel-version=${kernel_version}"
          } >> "${GITHUB_OUTPUT}"

      # check-digdir.yml names the assets by the tree it built. Only a successful run in this
      # repository counts, since a fork's pull request runs its own workflow file. The oldest is
      # the one whose digests a consumer could already have pinned: the bundles are not
      # byte-reproducible, so a later run of the same tree has other digests.
      - name: Find the check run that built this tree
        id: build
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          set -euo pipefail
          name="release-$(git rev-parse 'HEAD^{tree}')"
          run_id=""
          while read -r id; do
            run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}" --jq '"\(.status) \(.conclusion) \(.path)"')
            case "${run}" in
              "completed success .github/workflows/check-digdir.yml") run_id="${id}"; break ;;
              # A newer run has other digests, so wait for this one.
              *" .github/workflows/check-digdir.yml")
                if [ "${run%% *}" != completed ]; then
                  echo "::error::check run ${id} of this tree has not finished; run this workflow again once it has"
                  exit 1
                fi
                ;;
            esac
          done < <(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${name}&per_page=100" \
            --jq "[.artifacts[] | select((.expired | not) and .workflow_run.head_repository_id == ${REPOSITORY_ID})]
              | sort_by(.created_at) | .[].workflow_run.id")
          if [ -z "${run_id}" ]; then
            echo "::error::no successful check-digdir.yml run built this tree (${name}). If main-digdir moved after a pull request's checks ran, they built another tree. Run gh workflow run check-digdir.yml --ref main-digdir, wait for it to pass, then run gh workflow run release-digdir.yml --ref main-digdir"
            exit 1
          fi
          echo "Publishing the release assets of ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
          {
            echo "run-id=${run_id}"
            echo "name=${name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download the release assets
        if: steps.release.outputs.publish == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.build.outputs.name }}
          path: release-artifacts
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}

      - name: Verify the release assets
        if: steps.release.outputs.publish == 'true'
        run: (cd release-artifacts && sha256sum --check --strict checksums.sha256)

      - name: Write release notes
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          FIRMWARE_TAG: ${{ steps.firmware.outputs.tag }}
          KERNEL_VERSION: ${{ steps.firmware.outputs.kernel-version }}
        run: |
          set -euo pipefail
          upstream_tag="v${VERSION%-digdir.*}"
          upstream_commit=$(git ls-remote https://github.com/superradcompany/microsandbox.git \
            "refs/tags/${upstream_tag}" "refs/tags/${upstream_tag}^{}" | awk 'END { print $1 }')
          kernel_sha256=$(awk -v name="${KERNEL_VERSION}.tar.gz" '$2 == name { print $1 }' release-artifacts/checksums.sha256)
          cat > release-notes.md <<EOF
          Digdir build of Microsandbox ${VERSION}, built from ${GITHUB_SHA}.

          - Modifications: [the Digdir changes](https://github.com/${GITHUB_REPOSITORY}/compare/${upstream_commit}...${GITHUB_SHA}) on top of upstream Microsandbox [${upstream_tag}](https://github.com/superradcompany/microsandbox/releases/tag/${upstream_tag}).
          - Runtime: \`microsandbox-*.tar.gz\` host runtime bundles, libkrunfw libraries and guest agents for Linux, macOS and Windows.
          - Firmware: libkrunfw [${FIRMWARE_TAG}](https://github.com/digdir/libkrunfw/tree/${FIRMWARE_TAG}) with ${KERNEL_VERSION} (SHA-256 \`${kernel_sha256}\`).
          - Licenses: Microsandbox is licensed under Apache-2.0 (\`LICENSE\`). \`THIRD_PARTY_NOTICES.md\` lists the bundled third-party components. The GPL-2.0 corresponding source of the firmware is attached as \`libkrunfw-source.tar.gz\` and \`${KERNEL_VERSION}.tar.gz\`.
          - Checksums: \`checksums.sha256\`.
          EOF
          cat release-notes.md >> "${GITHUB_STEP_SUMMARY}"

      # Immutable releases lock their assets on publication, so upload every asset to a draft
      # first and publish it last. Publishing the draft creates its tag on the commit that
      # landed. A draft left by a failed run has no tag yet and is not immutable, and is replaced.
      - name: Publish the release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          # Every draft for the tag goes, so that the commands below, which find the release by
          # its tag, find only this run's.
          drafts=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.draft and .tag_name == \"${TAG}\") | .id")
          for id in ${drafts}; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
          gh release create "${TAG}" --draft --prerelease --target "${GITHUB_SHA}" \
            --title "${TAG}" --notes-file release-notes.md
          gh release upload "${TAG}" release-artifacts/*
          # A tag pushed since this run started would take the release in place of this commit.
          status=0
          git ls-remote --exit-code origin "refs/tags/${TAG}" > /dev/null || status=$?
          if [ "${status}" != 2 ]; then
            echo "::error::${TAG} appeared during this run, or could not be checked. The draft stays unpublished"
            exit 1
          fi
          gh release edit "${TAG}" --draft=false
