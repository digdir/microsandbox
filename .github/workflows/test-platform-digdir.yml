name: Test Platform (Digdir)

# Digdir copy of upstream's reusable test-platform.yml at v0.7.4, called by
# check-digdir.yml. Upstream's file stays unchanged and disabled. This copy
# uses the pinned Rust toolchain, lets the caller decide whether to save
# caches, and also runs the macOS system DNS resolver tests. Compare it with
# upstream's test-platform.yml on every synchronization.

on:
  workflow_call:
    inputs:
      target:
        description: Platform label used for artifacts and caches.
        required: true
        type: string
      runner:
        description: GitHub Actions runner label.
        required: true
        type: string
      os:
        description: Operating-system family (linux or darwin).
        required: true
        type: string
      agentd_target:
        description: Rust target for native Linux agentd tests.
        required: false
        default: ""
        type: string
      save_cache:
        description: Whether this caller should save Rust dependency caches.
        required: false
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  test:
    name: Test (${{ inputs.target }})
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pinned-rust-toolchain-digdir

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ inputs.save_cache }}

      - name: Install build deps (Linux)
        if: inputs.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools libcap-ng-dev

      # Reuse the runtime already built by Check Digdir. The SDK build script
      # discovers build/ in CI, so unit tests no longer repeat the release/LTO
      # msb, agentd, and libkrunfw build.
      - name: Download runtime artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: msb-${{ inputs.target }}
          path: build/

      - name: Test agentd (Linux)
        if: inputs.os == 'linux'
        run: |
          rustup target add ${{ inputs.agentd_target }}
          cargo test --manifest-path crates/agentd/Cargo.toml --target ${{ inputs.agentd_target }}

      - name: Set up mold (Linux host link)
        if: inputs.os == 'linux'
        uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 # 2.41.0

      - name: Test workspace
        run: cargo test --workspace --exclude microsandbox-agentd

      # The macOS resolver goes through mDNSResponder; these tests need the
      # runner's network, so they are ignored in the workspace run above.
      - name: Test macOS system DNS resolver
        if: inputs.os == 'darwin'
        run: |
          cargo test -p microsandbox-network --lib dns::upstream::system::macos:: -- --include-ignored
