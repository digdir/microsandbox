name: Check Digdir

# This fork consumes the Rust SDK and its bundled runtime. Language-package
# matrices remain outside downstream CI. The hardware-virtualization lanes are
# upstream's, run on GitHub-hosted runners, which expose KVM.
#
# Runs on pull requests and on demand. Caches are saved only in runs on
# main-digdir, which the release runbook in MAINTAINING-digdir.md makes part
# of every release.

on:
  pull_request:
    branches: [main-digdir]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main-digdir' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_MULTIPLEXING: "false"
  CARGO_INCREMENTAL: "0"
  LIBKRUNFW_VERSION: "5.6.1"
  LIBKRUNFW_ABI: "5"

jobs:
  select-run:
    name: Select CI run
    if: github.repository == 'digdir/microsandbox'
    permissions:
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run-checks: ${{ steps.select.outputs.run-checks }}
    steps:
      - name: Prefer automatic PR checks
        id: select
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CI_EVENT: ${{ github.event_name }}
          CI_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          run_checks=true
          if [ "${CI_EVENT}" = workflow_dispatch ] && [ "${CI_ATTEMPT}" = 1 ]; then
            run_created=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" --jq .created_at)
            automatic_run=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/check-digdir.yml/runs?event=pull_request&head_sha=${GITHUB_SHA}&per_page=100" \
              --jq ".workflow_runs | map(select(.status != \"completed\" or .updated_at >= \"${run_created}\")) | sort_by(.updated_at) | last | .html_url // empty")
            if [ -n "${automatic_run}" ]; then
              echo "::notice::Skipping duplicate manual checks; automatic PR run: ${automatic_run}"
              {
                echo "### Manual checks skipped"
                echo
                echo "This run did not execute build or test checks."
                echo "See the [automatic PR checks](${automatic_run}) for their status and results."
                echo
                echo "Use **Re-run all jobs** to execute this manual run explicitly."
              } >> "${GITHUB_STEP_SUMMARY}"
              run_checks=false
            fi
          fi
          echo "run-checks=${run_checks}" >> "${GITHUB_OUTPUT}"

  validate:
    name: Validate downstream source
    needs: select-run
    if: needs.select-run.outputs.run-checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout libkrunfw sources
        run: git submodule update --init --depth 1 vendor/libkrunfw

      - name: Validate downstream version and firmware source
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          case "${version}" in
            *-digdir.*) ;;
            *)
              echo "::error::workspace version must contain the -digdir.N prerelease suffix"
              exit 1
              ;;
          esac

          expected_remote=https://github.com/digdir/libkrunfw.git
          actual_remote=$(git config --file .gitmodules --get submodule.vendor/libkrunfw.url)
          if [ "${actual_remote}" != "${expected_remote}" ]; then
            echo "::error::libkrunfw submodule uses ${actual_remote}, expected ${expected_remote}"
            exit 1
          fi

          status=$(git submodule status vendor/libkrunfw)
          case "${status}" in
            [-+]*)
              echo "::error::libkrunfw submodule is not at its committed revision: ${status}"
              exit 1
              ;;
          esac

      - uses: ./.github/actions/pinned-rust-toolchain-digdir

      - name: Check the locked dependency graph
        run: cargo metadata --locked --format-version 1 >/dev/null

      - name: Validate release artifact checks
        run: python3 -m unittest scripts.ci.test_validate_linux_glibc scripts.ci.test_validate_release_artifacts

  build-kernel:
    name: Build guest kernel (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout libkrunfw sources
        run: git submodule update --init --depth 1 vendor/libkrunfw

      - name: Install kernel build dependencies
        run: sudo apt-get update && sudo apt-get install -y bc bison flex gcc libelf-dev make python3-pyelftools

      - name: Resolve kernel bundle cache key
        id: kernel-bundle
        shell: bash
        env:
          KERNEL_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          firmware_revision=$(git -C vendor/libkrunfw rev-parse HEAD)
          builder_id=$(
            {
              printf '%s\n' "${ImageOS}" "${ImageVersion}"
              gcc -dumpmachine &&
                gcc -dumpfullversion -dumpversion &&
                ld --version
            } | sha256sum | cut -d ' ' -f 1
          )
          # Bump v1 when changing the kernel build command or flags below.
          echo "key=digdir-kernel-bundle-v1-${KERNEL_ARCH}-${firmware_revision}-${builder_id}" >> "${GITHUB_OUTPUT}"

      - name: Restore kernel firmware bundle
        id: kernel-bundle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/libkrunfw/kernel.c
          key: ${{ steps.kernel-bundle.outputs.key }}

      - name: Prepare kernel source
        if: steps.kernel-bundle-cache.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-libkrunfw-kernel

      - name: Build kernel firmware bundle
        if: steps.kernel-bundle-cache.outputs.cache-hit != 'true'
        working-directory: vendor/libkrunfw
        run: make -j"$(nproc)" kernel.c

      - name: Validate kernel firmware bundle
        run: test -s vendor/libkrunfw/kernel.c

      - name: Save kernel firmware bundle
        if: github.ref == 'refs/heads/main-digdir' && steps.kernel-bundle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor/libkrunfw/kernel.c
          key: ${{ steps.kernel-bundle.outputs.key }}

      - name: Upload kernel firmware bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digdir-kernel-${{ matrix.arch }}
          path: vendor/libkrunfw/kernel.c
          compression-level: 0

  build-agentd:
    name: Build guest agent (${{ matrix.arch }})
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pinned-rust-toolchain-digdir
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main-digdir' }}
          shared-key: digdir-agentd-${{ matrix.arch }}

      - name: Install musl build dependencies
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build agentd
        run: |
          cargo build --locked --profile ci --manifest-path crates/agentd/Cargo.toml --target ${{ matrix.target }}
          mkdir -p build
          cp target/${{ matrix.target }}/ci/agentd build/agentd

      - name: Upload guest agent
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digdir-agentd-${{ matrix.arch }}
          path: build/agentd
          compression-level: 0

  build-linux:
    name: Build runtime (${{ matrix.target }})
    needs: [validate, build-kernel, build-agentd]
    runs-on: ${{ matrix.runner }}
    container:
      image: ${{ matrix.manylinux_image }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            arch: x86_64
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64@sha256:0c87ccb5996dab6c3b7612ee4fda7b80c4ab3c44a86c2541e4a872afdf4f131b
            libkrunfw_file: libkrunfw.so.5.6.1
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            arch: aarch64
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64@sha256:561427136aabf3787bffb294b3515748241e0962d1527ae28bea1e076bfb9d99
            libkrunfw_file: libkrunfw.so.5.6.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pinned-rust-toolchain-digdir

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main-digdir' }}
          shared-key: digdir-runtime-${{ matrix.target }}

      - name: Install build dependencies
        run: dnf install -y libcap-ng-devel

      - name: Download guest agent
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digdir-agentd-${{ matrix.arch }}
          path: build/

      - name: Download kernel firmware bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digdir-kernel-${{ matrix.arch }}
          path: firmware/

      - name: Build libkrunfw
        run: |
          mkdir -p build
          cc -fPIC -DABI_VERSION=${{ env.LIBKRUNFW_ABI }} -shared \
            -Wl,-soname,libkrunfw.so.${{ env.LIBKRUNFW_ABI }} \
            -o build/${{ matrix.libkrunfw_file }} firmware/kernel.c
          cd build
          ln -sf ${{ matrix.libkrunfw_file }} libkrunfw.so.${{ env.LIBKRUNFW_ABI }}
          ln -sf libkrunfw.so.${{ env.LIBKRUNFW_ABI }} libkrunfw.so

      - name: Build msb
        run: |
          cargo build --locked --profile ci --no-default-features --features embed-binaries,net,ssh -p microsandbox-cli
          cp target/ci/msb build/msb
          build/msb --version

      - name: Smoke test installed runtime discovery
        run: |
          python3 scripts/smoke/cli/test_runtime_discovery.py
          python3 scripts/smoke/cli/runtime-discovery.py \
            --msb build/msb --libkrunfw build/${{ matrix.libkrunfw_file }}

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msb-${{ matrix.target }}
          path: build/
          compression-level: 0

  build-macos:
    name: Build runtime (darwin-aarch64)
    needs: [validate, build-kernel, build-agentd]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pinned-rust-toolchain-digdir

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main-digdir' }}
          shared-key: digdir-runtime-darwin-aarch64

      - name: Download guest agent
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digdir-agentd-aarch64
          path: build/

      - name: Download kernel firmware bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digdir-kernel-aarch64
          path: firmware/

      - name: Build libkrunfw
        run: |
          mkdir -p build
          cc -fPIC -DABI_VERSION=${{ env.LIBKRUNFW_ABI }} -shared \
            -o build/libkrunfw.${{ env.LIBKRUNFW_ABI }}.dylib firmware/kernel.c
          cd build
          ln -sf libkrunfw.${{ env.LIBKRUNFW_ABI }}.dylib libkrunfw.dylib

      - name: Build and codesign msb
        run: |
          cargo build --locked --profile ci --no-default-features --features embed-binaries,net,ssh -p microsandbox-cli
          cp target/ci/msb build/msb
          codesign --entitlements msb-entitlements.plist --force -s - build/msb
          build/msb --version

      - name: Smoke test installed runtime discovery
        run: |
          python3 scripts/smoke/cli/runtime-discovery.py \
            --msb build/msb --libkrunfw build/libkrunfw.${{ env.LIBKRUNFW_ABI }}.dylib

      - name: Upload runtime artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msb-darwin-aarch64
          path: build/
          compression-level: 0

  rust-quality:
    name: Rust quality
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/pinned-rust-toolchain-digdir
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main-digdir' }}
          shared-key: digdir-rust-quality

      - name: Install build dependencies
        run: scripts/ci/install-apt-packages.sh musl-tools libcap-ng-dev

      - name: Download runtime artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msb-linux-x86_64
          path: build/

      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # 2.41.0

      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path crates/agentd/Cargo.toml -- --check

      - name: Check agentd
        run: cargo clippy --locked --manifest-path crates/agentd/Cargo.toml --target x86_64-unknown-linux-musl -- -D warnings

      - name: Clippy
        run: cargo clippy --locked --workspace --exclude microsandbox-agentd -- -D warnings

      # The feature set the embedding application builds the SDK with, and the
      # feature surfaces upstream keeps building without the packet engine.
      - name: Check feature surfaces
        run: |
          cargo test --locked -p microsandbox --no-default-features --features local,net --test api_compat
          cargo check --locked -p microsandbox --no-default-features --features local,net
          cargo check --locked -p microsandbox-runtime --no-default-features --features client,net
          cargo check --locked -p microsandbox-network --no-default-features
          cargo check --locked -p microsandbox-network --no-default-features --features control
          cargo check --locked -p microsandbox-types --features utoipa

      - name: Documentation
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --locked --workspace --exclude microsandbox-agentd --no-deps


  rust-test:
    name: Rust test (${{ matrix.target }})
    needs: [build-linux, build-macos]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-latest
            os: linux
            agentd_target: x86_64-unknown-linux-musl
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            os: linux
            agentd_target: aarch64-unknown-linux-musl
          - target: darwin-aarch64
            runner: macos-14
            os: darwin
            agentd_target: ""
    uses: ./.github/workflows/test-platform-digdir.yml
    with:
      target: ${{ matrix.target }}
      runner: ${{ matrix.runner }}
      os: ${{ matrix.os }}
      agentd_target: ${{ matrix.agentd_target }}
      save_cache: ${{ github.ref == 'refs/heads/main-digdir' }}

  # Hardware-virtualization lanes from upstream's check.yml. Upstream runs the
  # KVM jobs on a self-hosted runner; these run on GitHub-hosted Linux runners.
  rust-integration-build:
    name: Build Rust integration tests
    needs: build-agentd
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Keep the archive small while preserving file:line backtraces.
      CARGO_PROFILE_DEV_DEBUG: "line-tables-only"
      CARGO_PROFILE_TEST_DEBUG: "line-tables-only"
      # Rust's in-process backtraces can read zlib-compressed DWARF.
      RUSTFLAGS: "-C link-arg=-Wl,--compress-debug-sections=zlib"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (hosted Linux)
        run: |
          # These lanes do not use Android, .NET, or Haskell SDKs.
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - uses: ./.github/actions/pinned-rust-toolchain-digdir

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main-digdir' }}
          shared-key: digdir-rust-integration

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest@0.9.143

      - uses: rui314/setup-mold@da13e0b42e392e3a45d1215033a2270b849d7d36 # 2.41.0

      - name: Install build dependencies
        run: scripts/ci/install-apt-packages.sh libcap-ng-dev

      - name: Download guest agent
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digdir-agentd-x86_64
          path: build/

      - name: Build nextest archive
        run: |
          chmod +x build/agentd
          mkdir -p artifacts
          # The KVM job supplies both the host runtime and agentd explicitly,
          # so this archive needs neither download nor embedded binary features.
          mold -run cargo nextest archive --locked -p microsandbox --tests \
            --no-default-features --features keyring,local,net \
            --archive-file artifacts/rust-integration-tests.tar.zst

      - name: Upload nextest archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-integration-tests-linux-x86_64
          path: artifacts/rust-integration-tests.tar.zst
          compression-level: 0

  integration-test:
    name: Integration tests (linux-x86_64)
    needs: [build-linux, rust-integration-build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Free disk space (hosted Linux)
        run: |
          # These lanes do not use Android, .NET, or Haskell SDKs.
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2
        with:
          tool: cargo-nextest@0.9.143

      - name: Download runtime artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msb-linux-x86_64
          path: build/

      - name: Download nextest archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rust-integration-tests-linux-x86_64
          path: build/

      - name: Install msb
        run: |
          chmod +x build/msb build/agentd
          mkdir -p ~/.microsandbox/bin ~/.microsandbox/lib
          install -m755 build/msb ~/.microsandbox/bin/msb
          install -m644 build/libkrunfw.so.${{ env.LIBKRUNFW_VERSION }} ~/.microsandbox/lib/
          ln -sf libkrunfw.so.${{ env.LIBKRUNFW_VERSION }} ~/.microsandbox/lib/libkrunfw.so.${{ env.LIBKRUNFW_ABI }}
          ln -sf libkrunfw.so.${{ env.LIBKRUNFW_ABI }} ~/.microsandbox/lib/libkrunfw.so

      # MSB_TEST_ISOLATE_HOME=1 gives each test its own ~/.microsandbox, so two
      # threads are safe. The excluded tests need caller-provisioned VMs or
      # historical binaries; the fixtures below provision those.
      - name: Run integration tests
        env:
          MSB_TEST_ISOLATE_HOME: "1"
          MSB_TEST_RUNTIME_DIR: ${{ github.workspace }}/build
          MSB_AGENTD_PATH: ${{ github.workspace }}/build/agentd
        run: |
          export PATH="$HOME/.microsandbox/bin:$PATH"
          export LD_LIBRARY_PATH="${{ github.workspace }}/build:$HOME/.microsandbox/lib"
          ln -sf "libkrunfw.so.${{ env.LIBKRUNFW_VERSION }}" build/libkrunfw.so
          integration_config="$RUNNER_TEMP/msb-integration-config.json"
          printf '%s\n' '{"runtime":{"block_writeback":{"mode":"auto","pool_mib":4096}}}' > "$integration_config"
          export MSB_CONFIG_PATH="$integration_config"
          cargo-nextest nextest run \
            --archive-file build/rust-integration-tests.tar.zst \
            --workspace-remap "${{ github.workspace }}" \
            --run-ignored=only \
            -E 'not (binary(=jobs) or binary(=creation_progress_live) or binary(=eager_lifecycle_live) or test(/^backend::local::control::.*::live_/) or test(/^runtime::launch_contract::tests::released_/) or test(/^backend::local::database::tests::live_sdk_upgrades_catalog_with_previous_version_runtime$/))' \
            --test-threads 2

      - name: Managed-job integration fixtures
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        run: |
          python3 scripts/smoke/cli/managed-job-integration.py \
            --binary build/msb --agent build/agentd \
            --firmware "build/libkrunfw.so.${{ env.LIBKRUNFW_VERSION }}" \
            --archive build/rust-integration-tests.tar.zst \
            --workspace "${{ github.workspace }}" \
            --output build/managed-job-integration-results

      - name: Upload managed-job integration results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: managed-job-integration-results
          path: build/managed-job-integration-results/
          if-no-files-found: warn

      # This fixture needs a released runtime, not the candidate installed above.
      - name: Historical catalog compatibility (v0.6.18)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          # The fixture's debug-build test future needs nearly all of the default 2 MiB
          # test-thread stack upstream, and the Digdir patches push it over.
          RUST_MIN_STACK: "8388608"
        run: |
          python3 scripts/smoke/cli/catalog-history.py \
            --archive build/rust-integration-tests.tar.zst \
            --workspace "${{ github.workspace }}" \
            --cleanup-binary build/msb \
            --output build/catalog-history-results

      - name: Upload historical catalog results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-history-results
          path: build/catalog-history-results/*.log
          if-no-files-found: ignore

      - name: Checkpoint lifecycle integration fixtures
        if: ${{ !cancelled() }}
        run: |
          export LD_LIBRARY_PATH="${{ github.workspace }}/build:$HOME/.microsandbox/lib"
          python3 scripts/smoke/cli/checkpoint-integration.py \
            --binary build/msb --agent build/agentd \
            --firmware "build/libkrunfw.so.${{ env.LIBKRUNFW_VERSION }}" \
            --archive build/rust-integration-tests.tar.zst \
            --workspace "${{ github.workspace }}" \
            --output build/checkpoint-integration-results

      - name: Upload checkpoint lifecycle results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: checkpoint-integration-results
          path: build/checkpoint-integration-results/
          if-no-files-found: ignore

  cli-smoke-test:
    name: CLI smoke tests (linux-x86_64)
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space (hosted Linux)
        run: |
          # These lanes do not use Android, .NET, or Haskell SDKs.
          df -h /
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm

      - name: Download runtime artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: msb-linux-x86_64
          path: build/

      - name: Run CLI smoke tests
        run: |
          chmod +x build/msb build/agentd
          ln -sf libkrunfw.so.${{ env.LIBKRUNFW_VERSION }} build/libkrunfw.so.${{ env.LIBKRUNFW_ABI }}
          ln -sf libkrunfw.so.${{ env.LIBKRUNFW_ABI }} build/libkrunfw.so
          scripts/smoke/cli/image-archive.sh
          scripts/smoke/cli/split-irqchip-bind-net.sh
          python3 scripts/smoke/cli/hpack-secret-guard.py

      - name: CI helper and snapshot runner unit tests
        run: |
          python3 -m unittest discover -s scripts/ci -p test_install.py
          python3 -m unittest discover -s scripts/ci -p test_bump_version.py
          python3 -m unittest discover -s scripts/ci -p test_runner_storage.py
          python3 -m unittest discover -s scripts/smoke/cli -p test_snapshot_branch.py
          python3 -m unittest discover -s scripts/smoke/cli -p test_restore_resource_intent.py
          python3 -m unittest discover -s scripts/smoke/cli -p test_catalog_history.py
          python3 -m unittest discover -s scripts/smoke/cli -p test_managed_job_integration.py

      - name: Snapshot and branch live smoke
        # The short operation deadline excludes image setup and bounded cleanup.
        timeout-minutes: 15
        env:
          MSB_LIBKRUNFW_PATH: ${{ github.workspace }}/build/libkrunfw.so.${{ env.LIBKRUNFW_VERSION }}
          MSB_AGENTD_PATH: ${{ github.workspace }}/build/agentd
          LD_LIBRARY_PATH: ${{ github.workspace }}/build
        run: |
          status=0
          # Short isolated homes avoid Unix socket limits and cross-layout reuse.
          for layout in managed flat; do
            python3 scripts/smoke/cli/snapshot-branch.py \
              --binary "${{ github.workspace }}/build/msb" \
              --output "/tmp/msb-smoke-${{ github.run_id }}-${{ github.run_attempt }}-$layout" \
              --layout "$layout" || status=$?
          done
          exit "$status"

      - name: Collect snapshot smoke reports and logs
        if: always()
        run: |
          stage="${{ runner.temp }}/snapshot-branch-smoke-${{ github.run_id }}-${{ github.run_attempt }}"
          mkdir -p "$stage"
          for layout in managed flat; do
            source="/tmp/msb-smoke-${{ github.run_id }}-${{ github.run_attempt }}-$layout"
            destination="$stage/msb-smoke-${{ github.run_id }}-${{ github.run_attempt }}-$layout"
            if [ -f "$source/report.json" ]; then
              mkdir -p "$destination"
              cp -- "$source/report.json" "$destination/report.json"
            fi
            for log in "$source"/logs/*.log; do
              [ -f "$log" ] || continue
              mkdir -p "$destination/logs"
              cp -- "$log" "$destination/logs/"
            done
          done

      - name: Upload snapshot smoke reports and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snapshot-branch-smoke-linux-x86_64
          # Keep text evidence, not the potentially large guest RAM/disk artifacts.
          path: ${{ runner.temp }}/snapshot-branch-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: warn

  windows:
    name: Rust runtime and tests (${{ matrix.target }})
    needs: [validate, build-kernel, build-agentd]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            runner: windows-latest
            arch: x86_64
            rust_target: x86_64-pc-windows-msvc
            vs_arch: amd64
            vs_host_arch: amd64
          - target: windows-aarch64
            runner: windows-11-arm
            arch: aarch64
            rust_target: aarch64-pc-windows-msvc
            vs_arch: arm64
            vs_host_arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout libkrunfw sources
        shell: pwsh
        run: git submodule update --init --depth 1 vendor/libkrunfw

      - uses: ./.github/actions/pinned-rust-toolchain-digdir
        with:
          components: clippy
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          cache-bin: false
          cache-targets: true
          save-if: ${{ github.ref == 'refs/heads/main-digdir' }}
          shared-key: digdir-windows-${{ matrix.target }}

      - name: Download kernel firmware bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digdir-kernel-${{ matrix.arch }}
          path: vendor/libkrunfw/

      - name: Download guest agent
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: digdir-agentd-${{ matrix.arch }}
          path: build/

      - name: Build libkrunfw
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\vendor\libkrunfw\scripts\build-windows.ps1 `
            -SkipKernelBundle `
            -AbiVersion ${{ env.LIBKRUNFW_ABI }} `
            -Architecture ${{ matrix.vs_arch }} `
            -HostArchitecture ${{ matrix.vs_host_arch }} `
            -Output libkrunfw.dll `
            -ImportLibrary libkrunfw.lib
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Copy-Item vendor\libkrunfw\libkrunfw.dll build\libkrunfw.dll -Force

      - name: Build msb
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ matrix.vs_arch }} -HostArchitecture ${{ matrix.vs_host_arch }}
          cargo build --locked --profile ci --no-default-features --features embed-binaries,net,ssh -p microsandbox-cli --target ${{ matrix.rust_target }}
          Copy-Item target\${{ matrix.rust_target }}\ci\msb.exe build\msb.exe -Force
          & build\msb.exe --version

      - name: Smoke test installed runtime discovery
        shell: pwsh
        run: |
          python scripts/smoke/cli/test_runtime_discovery.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/smoke/cli/runtime-discovery.py --msb build/msb.exe --libkrunfw build/libkrunfw.dll

      - name: Check msb
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ matrix.vs_arch }} -HostArchitecture ${{ matrix.vs_host_arch }}
          cargo check --locked --no-default-features --features embed-binaries,net,ssh -p microsandbox-cli --target ${{ matrix.rust_target }}

      - name: Clippy msb
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ matrix.vs_arch }} -HostArchitecture ${{ matrix.vs_host_arch }}
          cargo clippy --locked --no-default-features --features embed-binaries,net,ssh -p microsandbox-cli --target ${{ matrix.rust_target }} -- -D warnings

      - name: Test Windows passthrough rename
        shell: pwsh
        env:
          MSB_AGENTD_PATH: ${{ github.workspace }}/build/agentd
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ matrix.vs_arch }} -HostArchitecture ${{ matrix.vs_host_arch }}
          cargo test --locked --no-default-features -p microsandbox-filesystem --lib --target ${{ matrix.rust_target }} rename

      - name: Test Windows drive mount paths
        shell: pwsh
        env:
          MSB_AGENTD_PATH: ${{ github.workspace }}/build/agentd
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ matrix.vs_arch }} -HostArchitecture ${{ matrix.vs_host_arch }}
          cargo test --locked --no-default-features --features local,net,runner,ssh -p microsandbox-utils -p microsandbox-runtime -p microsandbox -p microsandbox-cli --lib --target ${{ matrix.rust_target }} windows_drive

      - name: Test bind rootfs backend
        shell: pwsh
        # Tests build without embed-binaries and take the guest agent from this override.
        env:
          MSB_AGENTD_PATH: ${{ github.workspace }}/build/agentd
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ matrix.vs_arch }} -HostArchitecture ${{ matrix.vs_host_arch }}
          cargo test --locked --no-default-features --features net,runner -p microsandbox-runtime --lib --target ${{ matrix.rust_target }} test_bind_rootfs_backend_exposes_host_file_and_init

      - name: Test bind rootfs patches
        shell: pwsh
        # Tests build without embed-binaries and take the guest agent from this override.
        env:
          MSB_AGENTD_PATH: ${{ github.workspace }}/build/agentd
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ matrix.vs_arch }} -HostArchitecture ${{ matrix.vs_host_arch }}
          cargo test --locked --no-default-features --features local,net -p microsandbox --lib --target ${{ matrix.rust_target }} sandbox::patch::tests::bind_patch_

      - name: Test Windows lifecycle handoff and stdio cleanup
        shell: pwsh
        # Tests build without embed-binaries and take the guest agent from this override.
        env:
          MSB_AGENTD_PATH: ${{ github.workspace }}/build/agentd
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ matrix.vs_arch }} -HostArchitecture ${{ matrix.vs_host_arch }}
          cargo test --locked --no-default-features --features local,net -p microsandbox --lib --target ${{ matrix.rust_target }} runtime::spawn::tests::windows_

      - name: Test host paths, metrics registries, and confined volumes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ matrix.vs_arch }} -HostArchitecture ${{ matrix.vs_host_arch }}
          foreach ($filter in @('host_paths', 'config_paths', 'metrics_lookup', 'volume::fs')) {
            cargo test --locked --no-default-features --features local,net -p microsandbox --lib --target ${{ matrix.rust_target }} $filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test storage cleanup and recovery
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ matrix.vs_arch }} -HostArchitecture ${{ matrix.vs_host_arch }}
          foreach ($filter in @(
            'image::cleanup::tests',
            'backend::local::snapshot::store::tests',
            'external_import_alias_has_one_row_and_preserves_distinct_copies',
            'import_requires_durable_ownership_and_recovers_failed_completion',
            'storage::usage::local_usage::tests',
            'stopped_memory_sweep_registration_clears_on_runtime_shutdown'
          )) {
            cargo test --locked --no-default-features --features local,net -p microsandbox --lib --target ${{ matrix.rust_target }} $filter
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Test Windows filesystem DAX mappings
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ matrix.vs_arch }} -HostArchitecture ${{ matrix.vs_host_arch }}
          cargo test --locked --no-default-features -p microsandbox-filesystem --lib --target ${{ matrix.rust_target }} dax_

      - name: Test Windows DNS resolver
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . "$env:GITHUB_WORKSPACE\vendor\libkrunfw\scripts\msvc-env.ps1"
          Set-MsvcEnvironment -Architecture ${{ matrix.vs_arch }} -HostArchitecture ${{ matrix.vs_host_arch }}
          cargo test --locked -p microsandbox-network --lib --target ${{ matrix.rust_target }} dns::windows_resolver::
